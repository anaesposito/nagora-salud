name: Visual smoke — Nagora Salud

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install accessibility inspector
        run: npm install --no-save --package-lock=false axe-core@4.11.0
      - name: Start local app in isolated demo mode
        run: |
          NAGORA_DEMO_ONLY=1 NAGORA_DB=/tmp/nagora-visual-smoke.sqlite3 python server.py > /tmp/nagora-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/config >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nagora-server.log
          exit 1
      - name: Browser smoke and screenshots
        run: python tests/visual_smoke.py
        env:
          NAGORA_AXE_PATH: node_modules/axe-core/axe.min.js
      - name: Authentication UI on disposable accounts
        run: python tests/run_visual_local.py
        env:
          NAGORA_QA_DEMO_ONLY: '0'
          NAGORA_QA_SCRIPT: tests/auth_visual.py
          NAGORA_AXE_PATH: node_modules/axe-core/axe.min.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagora-visual-smoke
          path: artifacts/visual/
          if-no-files-found: warn
